modLoader="javafml"
loaderVersion="[4,)"
license="${mod.license}"
issueTrackerURL="${mod.issue_url}"

[[mods]]
modId="${mod.modid}"
version="${mod.version}"
displayName="Maledicta"
displayURL="${mod.source_url}"
updateJSONURL="https://assets.melanx.de/updates/maledicta.json"
authors="MelanX"
description="""
SpookyJam 2022 mod by MelanX, dealing with Curses
"""

[[dependencies.${mod.modid}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${mod.neoforge},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="minecraft"
    type="required"
    versionRange="[${mod.minecraft},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="libx"
    type="required"
    versionRange="[1.21.1-6.0.6,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config = "${mod.modid}.mixins.json"